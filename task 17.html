
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 7 Task 2 - Gambling Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #gameForm {
            width: 290px;
            margin: 30px auto;
            padding: 16px;
            border: 2px solid black;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .choices label,
        .buttons button {
            display: block;
            margin-bottom: 8px;
        }

        button {
            width: 100px;
            padding: 8px;
            border: 3px solid black;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #randomNumber {
            box-sizing: border-box;
            width: 100%;
            height: 42px;
            margin-top: 8px;
            border: 2px solid black;
            text-align: center;
            font-size: 22px;
        }

        .game-title {
            display: block;
            margin-top: 6px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <form id="gameForm">
        <div class="controls">
            <div class="choices">
                <label>
                    <input type="radio" id="below" name="bet">
                    below 35
                </label>

                <label>
                    <input type="radio" id="over" name="bet">
                    over 35
                </label>
            </div>

            <div class="buttons">
                <button type="reset">RESET</button>
                <button type="button" onclick="runGame()">RUN</button>
            </div>
        </div>

        <input type="text" id="randomNumber" readonly>
        <label class="game-title" for="randomNumber">Gambling Game</label>
    </form>

    <script>
        function runGame() {
            const choseBelow = document.getElementById("below").checked;
            const choseOver = document.getElementById("over").checked;

            if (!choseBelow && !choseOver) {
                alert("Please choose below 35 or over 35.");
                return;
            }

            const number = Math.floor(Math.random() * 71);
            document.getElementById("randomNumber").value = number;

            if (number === 35) {
                alert("It was a tie: please try again");
            } else if ((choseBelow && number < 35) ||
                       (choseOver && number > 35)) {
                alert("WIN: very good bet.");
            } else {
                alert("Lose: sorry, wrong bet.");
            }
        }
    </script>
</body>
</html>
